<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2D6748">
<title>Отара</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}
</style>
<style>
/* Layout: одноколоночное мобильное приложение — шапка, экран раздела, нижняя панель вкладок, выдвижные листы для карточек и форм */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --sunk:#E3E8DF; --fg:#1B261F; --muted:#5C6A60; --line:#D3DBCF;
  --accent:#2D6748; --accent-ink:#FFFFFF; --accent-soft:#D7E7DC;
  --tag:#F2C230; --tag-ink:#2A2108;
  --warn:#A86B12; --warn-soft:#F6E7C8; --bad:#B23E2B; --bad-soft:#F6D9D2; --good:#2D6748; --sheep:#B9822A; --goat:#2D6748;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19211C; --sunk:#0D120F; --fg:#E3EBE5; --muted:#93A298; --line:#2A352E;
  --accent:#73C292; --accent-ink:#0C1810; --accent-soft:#1F3428;
  --tag:#DFB22A; --tag-ink:#1F1805;
  --warn:#E3A94D; --warn-soft:#3A2D14; --bad:#E77E69; --bad-soft:#3D1E18; --good:#73C292; --sheep:#E2B05C; --goat:#73C292; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211C; --sunk:#0D120F; --fg:#E3EBE5; --muted:#93A298; --line:#2A352E;
  --accent:#73C292; --accent-ink:#0C1810; --accent-soft:#1F3428;
  --tag:#DFB22A; --tag-ink:#1F1805;
  --warn:#E3A94D; --warn-soft:#3A2D14; --bad:#E77E69; --bad-soft:#3D1E18; --good:#73C292; --sheep:#E2B05C; --goat:#73C292; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);padding-top:env(safe-area-inset-top,0px);font:15px/1.45 var(--f-body);font-variant-numeric:tabular-nums;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;display:flex;align-items:center;gap:10px}
.brand small{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}

main .wrap{padding-block:16px 24px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:var(--r);padding:10px 12px;font-size:13px}

/* поиск и фильтры */
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-weight:600;margin-left:4px}

/* список стада */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .main{min-width:0}
.row .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .side{text-align:right;font-size:13px;color:var(--muted)}
.row .side strong{display:block;color:var(--fg);font-weight:600;font-size:14px}
.row.gone{opacity:.6}

/* ушная бирка */
.tag{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:34px;padding:0 8px 0 16px;background:var(--tag);color:var(--tag-ink);border-radius:6px 14px 14px 6px;font-weight:700;font-size:14px;letter-spacing:.02em}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.tag.big{height:44px;min-width:72px;font-size:18px;padding-left:20px}
.tag.big::before{left:7px;width:8px;height:8px;margin-top:-4px}
.sex{font-weight:600}
.sex.f{color:var(--bad)} .sex.m{color:var(--accent)}

.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--sunk);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty p{margin:0;color:var(--muted);max-width:52ch}

/* кнопки */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);font-size:28px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.18)}

/* нижняя навигация */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);position:relative}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.badge{position:absolute;top:6px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:1px 5px;min-width:16px}

/* план */
.plan{display:flex;flex-direction:column;gap:8px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:12px 14px}
.task.over{border-left-color:var(--bad)} .task.soon{border-left-color:var(--warn)} .task.later{border-left-color:var(--accent)}
.task .when{font-size:12px;color:var(--muted);text-align:center;min-width:46px}
.task .when b{display:block;font-family:var(--f-display);font-weight:500;font-size:18px;color:var(--fg)}
.task .what{min-width:0}
.task .what .t{font-weight:600}
.task .what .s{font-size:13px;color:var(--muted)}

/* сводка */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--f-display);font-weight:500;font-size:24px}
.stat .l{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:first-child{color:var(--muted)}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.exp i{background:var(--warn)}
.money.plus{color:var(--good)} .money.minus{color:var(--bad)}
.monthsel{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthsel button{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:36px}

/* лист */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow-y:auto;border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.x{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg label{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.err{color:var(--bad);font-size:13px;margin:0}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--surface);padding:10px 12px;min-width:0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.timeline{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .d{font-size:13px;color:var(--muted)}
.ev .t{font-weight:600}
.ev .s{font-size:13px;color:var(--muted)}
.ev .by{font-size:12px;color:var(--muted)}
.spark{width:100%;height:56px;display:block}
.confirm{background:var(--bad-soft);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

/* --- разделы v2 --- */
.muted{color:var(--muted);font-size:13px}
.title-lg{font-family:var(--f-display);font-size:18px;font-weight:500}
.page{font-size:20px}
.back{border:0;background:none;padding:0;color:var(--accent);font-weight:600;align-self:flex-start}
.banner.as-btn{border:0;text-align:left;width:100%;font-weight:500}
.banner .link{font-size:13px}
.segb{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.segb button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:500;color:var(--muted)}
.segb button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.barn{display:flex;flex-direction:column;gap:8px}
.barn-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.barn-head span{color:var(--muted);font-size:13px}
.pens{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.pen{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;min-width:0}
.pen b{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.2}
.pen span{font-size:12px;color:var(--muted)}
.pen i{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pen.empty{background:transparent;border-style:dashed}
.pen.q{border-color:var(--warn)}
.pen:hover{border-color:var(--accent)}
.pgroup{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pchips{display:flex;flex-wrap:wrap;gap:4px}
.pchip{position:relative;min-width:34px;text-align:center;padding:6px 4px;border:1px solid var(--line);border-radius:8px;font-size:13px;cursor:pointer;background:var(--surface)}
.pchip.dim{color:var(--muted);border-style:dashed}
.pchip sup{color:var(--warn);font-weight:700}
.pchip input{position:absolute;opacity:0;pointer-events:none}
.pchip:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-style:solid}
.pchip:has(input:checked) sup{color:var(--accent-ink)}
.pchip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.irow{display:grid;grid-template-columns:minmax(0,1fr) 92px 34px;gap:6px;align-items:center}
.irow select,.irow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;min-width:0}
.list.scroll{max-height:260px;overflow-y:auto}
.pickrow{grid-template-columns:auto auto 1fr;cursor:pointer}
.movebar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.kids{display:flex;flex-direction:column;gap:6px}
.kid{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:0;background:var(--sunk);border-radius:10px;padding:6px 10px;text-align:left}
.kidrow{display:grid;grid-template-columns:20px minmax(0,1fr) 92px 72px;gap:6px;align-items:center}
.kidrow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 8px;width:100%;min-width:0}
.kidrow .seg label{padding:6px 4px}
.kn{font-weight:600;color:var(--muted);text-align:center}
.birth{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:var(--r);padding:12px}
.milk-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:8px}
.mhead strong{font-family:var(--f-display);font-weight:500;font-size:20px}
.sess{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px}
.sess em{font-style:normal;color:var(--accent);font-weight:600}
.lg{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px}
.lgs{display:flex;gap:12px;font-size:12px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-dasharray:3 3}
.chart .axis{stroke:var(--line)}
.mtot{position:sticky;top:-8px;z-index:2;background:var(--bg);display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.mtot strong{font-family:var(--f-display);font-weight:500;font-size:22px}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 84px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .main{cursor:pointer}
.mrow input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;text-align:right;font-size:17px;font-weight:600}
.mbal{background:var(--sunk);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.mbal .total{border-top:1px solid var(--line);padding-top:6px;margin-top:2px;font-size:16px}
.ev{border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.by{display:block}
.login{max-width:420px;margin:6vh auto 0;display:flex;flex-direction:column;gap:16px}
.login h1{font-family:var(--f-display);font-weight:700;font-size:28px;margin:0}
.login p{margin:0;color:var(--muted)}
.sheet>*,.sheet form>*{flex-shrink:0}
.pchk{position:relative;cursor:pointer}
.pchk input{position:absolute;opacity:0;pointer-events:none}
.pchk:has(input:checked){background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pchk:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.view-link{align-self:flex-start}
.pen em{font-style:normal;font-size:11px;color:var(--fg);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.filebtn{position:relative;text-align:center;cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.issues{background:var(--warn-soft);border-radius:var(--r);padding:10px 12px}
.issues.info{background:var(--sunk)}
.issues summary{font-weight:600;cursor:pointer}
.issues ul{margin:8px 0 0;padding-left:18px;max-height:260px;overflow-y:auto;font-size:13px;display:flex;flex-direction:column;gap:4px}
#imres{display:flex;flex-direction:column;gap:12px}
.herdtop{display:flex;flex-direction:column;gap:2px}
.bignum{font-family:var(--f-display);font-weight:500;font-size:40px;line-height:1.1}
.bignum span{font-size:20px;color:var(--muted)}
.gblock{display:flex;flex-direction:column;gap:6px}
.gtitle{display:flex;justify-content:space-between;align-items:baseline}
.gtitle b{font-family:var(--f-display);font-weight:500;font-size:18px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.gbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;min-width:0}
.gbtn span{font-size:14px;min-width:0}
.gbtn b{font-family:var(--f-display);font-weight:500;font-size:17px}
.gbtn.zero{background:transparent;border-style:dashed;color:var(--muted)}
.gbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg);border-style:solid}
.listhead{align-items:center}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.mday-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mtable{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mtable th,.mtable td{padding:4px;text-align:center;font-size:14px}
.mtable thead th{font-size:12px;color:var(--muted);font-weight:600}
.mtable tbody th{text-align:left;font-weight:500;color:var(--muted);width:72px}
.mtable td.sum{font-weight:700}
.mtable tr.tot th,.mtable tr.tot td{border-top:1px solid var(--line);padding-top:8px;font-weight:700;color:var(--fg)}
.mcell{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:48px;justify-content:center}
.mcell b{font-size:17px}
.mcell small{font-size:11px;color:var(--muted)}
.mcell em{font-style:normal;font-size:20px;color:var(--accent);font-weight:600}
.sechead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand">Отара <small>учёт МРС</small></div>
  <div class="sync" id="sync"><span class="dot"></span><span>подключение…</span></div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<button class="fab" id="fab" aria-label="Добавить">+</button>

<nav class="tabs" aria-label="Разделы"><div class="wrap">
  <button data-tab="herd" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14c-1.7 0-3-1.3-3-3s1.3-3 3-3c.3-1.7 1.8-3 3.5-3 1.1 0 2 .5 2.7 1.2A3.5 3.5 0 0 1 18 8c1.7 0 3 1.3 3 3s-1.3 3-3 3"/><path d="M6 14h12v2a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3z"/><path d="M9 19v2M15 19v2"/></svg>Стадо</button>
  <button data-tab="pens"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10l9-6 9 6"/><path d="M5 9v11h14V9"/><path d="M9 20v-6h6v6"/><path d="M12 14v6"/></svg>Загоны</button>
  <button data-tab="milk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6M10 2v3l-3 4v11a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9l-3-4V2"/><path d="M7 13h10"/></svg>Молоко</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l9-5 9 5v12H3z"/><path d="M7 20v-8h10v8"/><path d="M7 15h10"/></svg>Склад</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Ещё<span class="badge" id="moreBadge" hidden></span></button>
</div></nav>

<div id="sheetRoot"></div>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
<script>if('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js'));</script>
</body>
</html>
